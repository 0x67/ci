name: release-please

# Reusable release workflow. release-please parses Conventional Commits, bumps
# Cargo.toml + CHANGELOG.md in a release PR, then tags + creates the GitHub
# Release when that PR merges. No cargo publish, no cargo package.
#
# Why not release-plz: release-plz runs `cargo package` internally to compute
# the next version. `cargo package` cannot resolve an unpublished cross-repo git
# dependency (transport_core is git-tag only, on no registry), so it always
# fails once the polaris registry went away. release-please only edits
# Cargo.toml + CHANGELOG.md as text, so unpublished git deps are a non-issue.
# see release-plz #2595.
#
# Single source of truth: .release-please-manifest.json (current version) +
# Conventional Commits since the last tag. Per-crate config in
# release-please-config.json (release-type rust, component = crate name,
# include-component-in-tag so tags stay <crate>-vX.Y.Z).

on:
  workflow_call:
    inputs:
      config-file:
        description: "Path to release-please-config.json."
        required: false
        default: "release-please-config.json"
        type: string
      manifest-file:
        description: "Path to .release-please-manifest.json."
        required: false
        default: ".release-please-manifest.json"
        type: string
      runner:
        description: "runs-on value. Bare string (ubuntu-latest) or JSON array of labels."
        required: false
        default: "ubuntu-latest"
        type: string
      update-lock:
        description: "Refresh Cargo.lock on the release PR. Needed when the release type does not maintain the lockfile itself, as a single lockstep component over a cargo workspace does not."
        required: false
        default: false
        type: boolean
    secrets:
      release-token:
        description: "PAT (contents: write + pull-requests: write). A PAT (not GITHUB_TOKEN) so the tag push retriggers downstream CI."
        required: true
      private-dep-token:
        description: "Read-only token (Contents: Read) for private git dependencies, used only while cargo resolves the lockfiles. No-op when absent."
        required: false

concurrency:
  group: release-please-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ${{ startsWith(inputs.runner, '[') && fromJSON(inputs.runner) || inputs.runner }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: verify release-token present
        env:
          TOKEN: ${{ secrets.release-token }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::release-token secret is empty. Set RELEASE_PLZ_TOKEN in the caller repo."
            exit 1
          fi

      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.release-token }}
          config-file: ${{ inputs.config-file }}
          manifest-file: ${{ inputs.manifest-file }}

      # A lockstep component bumps crate versions through extra-files, and no
      # updater can carry those into Cargo.lock: cargo rewrites that file and
      # strips the annotations a generic updater needs. Refresh the lockfiles on
      # the PR branch instead, so a --locked build of the release commit works.
      # Detached fuzz workspaces keep their own Cargo.lock and go stale the same
      # way, so every tracked fuzz lockfile is refreshed on each release PR.
      - uses: actions/checkout@v7
        if: steps.release.outputs.pr
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
          token: ${{ secrets.release-token }}
          persist-credentials: false

      - name: refresh lockfiles
        if: steps.release.outputs.pr
        env:
          BRANCH: ${{ fromJSON(steps.release.outputs.pr || '{}').headBranchName }}
          UPDATE_LOCK: ${{ inputs.update-lock }}
          DEP_TOKEN: ${{ secrets.private-dep-token }}
          RELEASE_TOKEN: ${{ secrets.release-token }}
        run: |
          set -euo pipefail

          # The checkout keeps no credentials, so the read-only token is the
          # only one cargo can send. It is dropped before the push.
          if [ -n "$DEP_TOKEN" ]; then
            gitcfg="$RUNNER_TEMP/dep-gitconfig"
            printf '[url "https://x-access-token:%s@github.com/"]\n\tinsteadOf = https://github.com/\n' "$DEP_TOKEN" > "$gitcfg"
            export GIT_CONFIG_GLOBAL="$gitcfg" CARGO_NET_GIT_FETCH_WITH_CLI=true
          fi

          if [ "$UPDATE_LOCK" = "true" ]; then
            # workspace members only: external pins stay exactly as resolved
            cargo update --workspace
          fi

          # metadata without --locked rewrites only the entries that changed
          while IFS= read -r -d '' lock; do
            manifest="$(dirname "$lock")/Cargo.toml"
            grep -q '^\[workspace\]' "$manifest" 2>/dev/null || continue
            cargo metadata -q --format-version 1 --manifest-path "$manifest" > /dev/null
          done < <(git ls-files -z ':(glob)**/fuzz/Cargo.lock')

          unset GIT_CONFIG_GLOBAL CARGO_NET_GIT_FETCH_WITH_CLI

          changed="$(git diff --name-only -- Cargo.lock ':(glob)**/fuzz/Cargo.lock')"
          if [ -z "$changed" ]; then
            echo "lockfiles already match the bumped versions"
            exit 0
          fi
          echo "$changed"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '%s\n' "$changed" | xargs git add --
          git commit -m "chore(release): refresh lockfiles"
          git push "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"
